name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://certos_app:ci-only-app-pw@localhost:5432/test?sslmode=disable
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/api/go.mod, cache-dependency-path: services/api/go.sum }
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Create the restricted runtime role (RLS tests run as this role)
        run: |
          go run ./cmd/api migrate up
          go run ./cmd/api db provision-runtime-role
        env:
          APP_ENV: development
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          APP_DB_USER: certos_app
          APP_DB_PASSWORD: ci-only-app-pw
      - run: go test -race ./...   # includes migration up/down against Postgres
      - run: go build ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - run: docker compose build api web
