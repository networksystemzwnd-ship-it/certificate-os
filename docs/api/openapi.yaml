openapi: 3.0.3
info:
  title: CertificateOS API
  version: 0.9.0
  description: |
    Cookie-session authentication. State-changing requests must send `X-CSRF-Protection: 1`.
    Errors use a single envelope: `{ "error": { "code", "message", "request_id", "details" } }`.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get: { summary: Liveness, responses: { '200': { description: Process is up } } }
  /readyz:
    get:
      summary: Readiness (dependency health)
      responses: { '200': { description: Ready }, '503': { description: A dependency is unavailable } }
  /api/v1/auth/register:
    post:
      summary: Create a normal user account (never accepts a role)
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      summary: Log in; sets an HttpOnly session cookie
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session (idempotent)
      responses: { '204': { description: Logged out } }
  /api/v1/me:
    get:
      summary: Current user and display-only permissions
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/institutes:
    get:
      summary: Institutes the current user is an active member of
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/institute:
    get:
      summary: The current institute (tenant) with the caller's role and effective permissions
      description: Tenant is resolved from the caller's memberships. Send X-Institute-ID when the user belongs to several.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '200': { description: OK }
        '400': { description: institute_required (several memberships, no header), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Not a member (identical for non-existent institutes), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/courses:
    get:
      summary: List courses (requires courses.read)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InstituteId'
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive search }
        - { name: archived, in: query, schema: { type: string, enum: [only, all] }, description: Default lists active records only }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: "OK: {courses: [...], has_more, limit, offset}" }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a course (requires courses.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/courses/{id}:
    get:
      summary: Get a course
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update course fields (requires courses.write; unknown fields rejected)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Archive a course (never hard-deleted; requires courses.write); blocked with 409 while it has active batches
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Archived (idempotent) }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/courses/{id}/restore:
    post:
      summary: Restore an archived course (requires courses.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/batches:
    get:
      summary: List batches (requires courses.read)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InstituteId'
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive search }
        - { name: archived, in: query, schema: { type: string, enum: [only, all] }, description: Default lists active records only }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: course_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "OK: {batches: [...], has_more, limit, offset}" }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a batch (requires courses.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/batches/{id}:
    get:
      summary: Get a batch
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update batch fields (requires courses.write; unknown fields rejected)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Archive a batch (never hard-deleted; requires courses.write); blocked with 409 while it has active enrollments
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Archived (idempotent) }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/batches/{id}/restore:
    post:
      summary: Restore an archived batch (requires courses.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/students:
    get:
      summary: List students (requires students.read)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InstituteId'
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive search }
        - { name: archived, in: query, schema: { type: string, enum: [only, all] }, description: Default lists active records only }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: course_id, in: query, schema: { type: string, format: uuid } }
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [enrolled, completed, withdrawn] } }
      responses:
        '200': { description: "OK: {students: [...], has_more, limit, offset}" }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a student (requires students.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/students/{id}:
    get:
      summary: Get a student
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update student fields (requires students.write; unknown fields rejected)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Archive a student (never hard-deleted; requires students.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Archived (idempotent) }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/students/{id}/restore:
    post:
      summary: Restore an archived student (requires students.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/students/{id}/enrollments:
    post:
      summary: Enroll a student in a batch (requires students.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: Created }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Already enrolled in this batch, or the batch/student is archived, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/students/{id}/enrollments/{eid}:
    patch:
      summary: Change enrollment status, completion date and grade (requires students.write)
      description: completion_date/grade live on the enrollment (D-125); leaving "completed" clears the completion date unless one is sent.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { $ref: '#/components/parameters/Id' }, { name: eid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/students/imports:
    post:
      summary: Upload a CSV for import (requires students.import)
      description: >
        multipart/form-data with a `file` field (CSV, UTF-8, up to 2 MB and 2000 rows; `;` and tab delimiters are
        detected). Nothing is written to the student list. Returns the job with the headers, a suggested column
        mapping and a preview. XLSX is not supported yet (422 with instructions).
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/students/imports/{iid}:
    get:
      summary: Import job with counts, preview rows and the first 100 row problems
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: iid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Cancel an unconfirmed import and discard its stored rows
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: iid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Cancelled }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/students/imports/{iid}/mapping:
    put:
      summary: Map columns and validate every row (still writes nothing to the student list)
      description: >
        Body `{mapping: {field: columnIndex}, date_format: iso|dmy|mdy}`. Fields: full_name (required), student_number,
        email, phone, course, batch, status, completion_date, grade. Duplicates (same student number, or same name and
        email, in the file or already stored, archived students included) are reported and never overwritten.
        Can be repeated until confirmed.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: iid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/students/imports/{iid}/errors:
    get:
      summary: CSV report of rows that were not imported (row, result, problem, original cells)
      description: Cells that spreadsheets would treat as formulas are prefixed with an apostrophe.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: iid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: text/csv attachment, content: { text/csv: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/students/imports/{iid}/confirm:
    post:
      summary: Import the valid rows
      description: >
        Re-validates against current data, then saves rows one by one through the normal student rules (each with its
        own audit event). A concurrent or repeated confirm gets 409; an interrupted confirm resumes after 5 minutes
        without importing any row twice.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: iid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/institute/members:
    get:
      summary: Members of the current institute, with their email (requires staff.manage)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/institute/members/{mid}:
    patch:
      summary: Change a member's role (admin or staff) and extra grants (requires staff.manage)
      description: Owners and your own membership cannot be changed (409). Admins cannot have grants. Grants are validated (422).
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: mid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { type: string, enum: [admin, staff] }, grants: { type: array, items: { type: string } } } }
      responses:
        '200': { description: "OK: {member}" }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove a member (soft, status becomes removed and access ends immediately) (requires staff.manage)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: mid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK: {removed: true}" }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Owner or own membership, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/institute/invitations:
    post:
      summary: Invite someone by email as admin or staff (requires staff.manage)
      description: >
        Returns the invitation plus a one-time `token` and `accept_path` (`/accept-invite#token=...`). The token is
        shown only in this response; only its SHA-256 hash is stored. No email is sent yet: the owner hands the link
        over. Valid for 7 days, usable only by the invited email address. One live pending invitation per email;
        at most 50 pending per institute.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string, enum: [admin, staff] }, grants: { type: array, items: { type: string } } } }
      responses:
        '201': { description: "Created: {invitation, token, accept_path}" }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: Already invited, already a member, or too many pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
    get:
      summary: Invitations of the current institute, newest first; never includes tokens (requires staff.manage)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '200': { description: "OK: {invitations: [...]}; status is pending, accepted, revoked or expired" }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/institute/invitations/{iid}:
    delete:
      summary: Revoke a pending invitation (requires staff.manage)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: iid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK: {invitation}" }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Not pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/invitations/accept:
    post:
      summary: Accept an invitation (signed-in user whose email matches the invitation)
      description: >
        Body `{token}`. Every failure (unknown, expired, revoked, already used, different account, suspended or closed
        institute) is the same 404, so the endpoint reveals nothing. A removed membership is reactivated. Rate limited
        per user and per IP (429). Does not use X-Institute-ID: the invitee has no tenant context yet.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: "OK: {institute: {id, slug, name}, role}" }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-presets:
    get:
      summary: Ready-made template starting points and the allowed text placeholders (requires templates.read)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      responses:
        '200': { description: "OK: {presets: [{preset, label, config}], placeholders: [...]}" }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates:
    get:
      summary: List templates with their current version (requires templates.read)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InstituteId'
        - { name: q, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: string, enum: [only, all] }, description: Default lists active templates only }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: "OK: {templates: [...], has_more, limit, offset}" }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a template (version 1) from a validated configuration (requires templates.write)
      description: >
        `config` is a preset plus fixed fields (preset, orientation, accent_color #rrggbb, title, body with the
        allowed {{placeholders}}, signatory, footer, show_* switches). There is no free-form HTML or CSS.
        Duplicate active names (case-insensitive) are refused with 409.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, config], properties: { name: { type: string }, config: { type: object } } }
      responses:
        '201': { description: "Created: {template}" }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates/preview:
    post:
      summary: Render an unsaved draft configuration with sample data (requires templates.read)
      description: Returns self-contained HTML (all text escaped, no script, no external resource). Show it in a sandboxed iframe. Never uses real student data.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [config], properties: { config: { type: object } } }
      responses:
        '200': { description: "OK: {html}" }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates/{tid}:
    get:
      summary: A template with its current configuration and all version summaries (requires templates.read)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK: {template}" }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Rename a template (requires templates.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        '200': { description: "OK: {template}" }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Archive a template (never hard-deleted; existing versions stay readable) (requires templates.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK: {template}" }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates/{tid}/restore:
    post:
      summary: Restore an archived template (409 when its name is now taken) (requires templates.write)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK: {template}" }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates/{tid}/versions:
    post:
      summary: Save a new immutable version (becomes the current one) (requires templates.write)
      description: Versions are append-only; earlier versions never change. 409 for an archived template or at the 100-version limit.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [config], properties: { config: { type: object } } }
      responses:
        '201': { description: "Created: {version}" }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates/{tid}/versions/{n}:
    get:
      summary: One stored version with its configuration (requires templates.read)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }, { name: "n", in: path, required: true, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses:
        '200': { description: "OK: {version}" }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/certificate-templates/{tid}/preview:
    post:
      summary: Preview a stored version (default current) or, with `config`, an unsaved draft for this template (requires templates.read)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: tid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { version: { type: integer }, config: { type: object } } }
      responses:
        '200': { description: "OK: {html}" }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/certificates:
    post:
      summary: Issue one certificate for a completed enrollment (requires certificates.issue)
      description: >
        Allocates the next number (CERT-YYYY-NNNNNN, per institute and UTC year), freezes an immutable snapshot of
        what the certificate shows, renders the PDF and stores it. The certificate is reported as issued only
        after the PDF is stored. `template_version` 0 or omitted means the template's current version. 422 when
        the enrollment is not completed, the student is archived or the template is archived; 409 when the
        enrollment already has a live certificate; 503 `render_unavailable` when no PDF renderer is configured
        (nothing is written); 502 `render_failed` when rendering failed (kept as a `failed` record, its number is
        never reused).
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enrollment_id, template_id], properties: { enrollment_id: { type: string }, template_id: { type: string }, template_version: { type: integer, minimum: 0, maximum: 100 } } }
      responses:
        '201': { description: "Created: {certificate}" }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      summary: List certificates, newest first (requires certificates.read)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InstituteId'
        - { name: status, in: query, schema: { type: string, enum: [pending, issued, failed, revoked] } }
        - { name: student_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Matches the certificate number or the student name }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: "OK: {certificates: [...], has_more, limit, offset}" }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/certificates/{cid}:
    get:
      summary: One certificate with its snapshot fields, status and verification link (requires certificates.read)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: cid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK: {certificate}" }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/certificates/{cid}/pdf:
    get:
      summary: Download the stored PDF of an issued or revoked certificate (requires certificates.read)
      description: >
        Served as an attachment with `Cache-Control: private, no-store`, `X-Content-Type-Options: nosniff` and
        the SHA-256 of the file as ETag. 404 for pending or failed certificates and for other institutes.
        Needs the X-Institute-ID header like every tenant route, so fetch it with the API client and save the blob.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: cid, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/certificates/{cid}/revoke:
    post:
      summary: Revoke an issued certificate (requires certificates.revoke)
      description: A reason of 3–500 characters is required. The PDF stays stored. A revoked enrollment can be issued again.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstituteId' }, { name: cid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } }
      responses:
        '200': { description: "OK: {certificate}" }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Not issued, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/institute-applications:
    post:
      summary: Start an application (draft). Any subset of fields; provided fields are validated. One open application per user.
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ApplicationPatch' }
      responses:
        '201': { $ref: '#/components/responses/Application' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      summary: The caller's own applications
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/institute-applications/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: One of the caller's own applications (another user's id is 404)
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Application' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      summary: Edit details (only while draft or changes_requested)
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ApplicationPatch' }
      responses: { '200': { $ref: '#/components/responses/Application' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/institute-applications/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Submit for review (all required fields and the attestation must be present; reserves the slug)
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Application' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications:
    get:
      summary: Review queue (never includes drafts). Requires ops.applications.read
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, description: Comma-separated statuses, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Application detail (requires ops.applications.read)
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Application' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Audit history of one application (requires ops.applications.read)
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications/{id}/start-review:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: submitted → under_review (requires ops.applications.review; reviewers cannot review their own application)
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Application' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Approve — atomically creates the institute and makes the applicant its owner (optional body {note})
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Approved; returns application and institute }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Reject with a reason (10–2000 characters; shown to the applicant)
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Application' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institute-applications/{id}/request-changes:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Ask the applicant to change details (reason 10–2000 characters)
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { $ref: '#/components/responses/Application' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institutes:
    get:
      summary: List institutes (requires ops.institutes.manage); q matches name or slug
      security: [{ cookieAuth: [] }]
      parameters: [{ name: q, in: query, required: false, schema: { type: string } }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institutes/{id}/suspend:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Suspend an active institute (read-only for members, D-114). Reason required.
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/institutes/{id}/reactivate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Reactivate a suspended institute
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/ops/audit:
    get:
      summary: "Audit log, newest first (super_admin only: ops.audit.read)"
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: entity_id, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 200 } }
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
components:
  parameters:
    InstituteId:
      name: X-Institute-ID
      in: header
      required: false
      description: Selects among the caller's own memberships; never trusted on its own.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: cos_session }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, minLength: 12, maxLength: 128 }
    ApplicationPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name: { type: string }
              slug: { type: string }
              category: { type: string, enum: [training_institute, academy, vocational_centre, school, college, other] }
              address_line1: { type: string }
              address_line2: { type: string }
              city: { type: string }
              region: { type: string }
              postal_code: { type: string }
              country: { type: string, description: ISO 3166-1 alpha-2 }
              official_email: { type: string }
              phone: { type: string }
              rep_name: { type: string }
              rep_role: { type: string }
              website: { type: string }
              attested: { type: boolean }
    Reason:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 10, maxLength: 2000 } } }
  responses:
    Application:
      description: The application
      content: { application/json: { schema: { type: object, properties: { application: { type: object } } } } }
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    UserEnvelope:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            platform_role: { type: string, enum: [super_admin, ops] }
            permissions: { type: array, items: { type: string } }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }
